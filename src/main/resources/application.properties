spring.application.name=thymeleaf-cheatsheet

spring.thymeleaf.cache=false
spring.thymeleaf.prefix=file:src/main/resources/templates/

# =============================================================================
# Azure Active Directory — Spring Cloud Azure 6.x
# =============================================================================
# Requires TWO Azure AD App Registrations in the same tenant:
#
#   App Reg 1  (REST API / Resource Server)
#   ----------------------------------------
#   - Azure Portal > App registrations > <api-app> > Expose an API
#   - Set Application ID URI, e.g.: api://<rest-api-client-id>
#   - No redirect URIs needed
#
#   App Reg 2  (Web UI / OAuth2 Client)
#   ----------------------------------------
#   - Azure Portal > App registrations > <web-app> > Authentication
#   - Platform: Web
#   - Redirect URI: http://localhost:8080/login/oauth2/code/
#   - Generate a client secret under "Certificates & secrets"
# =============================================================================

# UI security profile — uncomment to switch from NOOP to Azure AD OIDC for the web UI
# spring.profiles.active=azure-ui-auth

spring.cloud.azure.active-directory.enabled=true

# Shared tenant (both registrations live in the same Azure AD directory)
spring.cloud.azure.active-directory.profile.tenant-id=<your-tenant-id>

# Enable both resource server (REST) and web application (Thymeleaf SSO) in one app
spring.cloud.azure.active-directory.application-type=web_application_and_resource_server

# App Reg 2 — Web UI: credentials used for the OIDC login flow
spring.cloud.azure.active-directory.credential.client-id=<your-web-ui-client-id>
spring.cloud.azure.active-directory.credential.client-secret=<your-web-ui-client-secret>

# App Reg 1 — REST API: the Application ID URI used to validate the 'aud' claim in Bearer JWTs
# Default format: api://<rest-api-client-id>  (matches what Azure sets by default)
spring.cloud.azure.active-directory.app-id-uri=api://<your-rest-api-client-id>