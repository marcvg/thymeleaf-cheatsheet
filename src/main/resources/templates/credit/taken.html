<!doctype html>
<html lang="en" data-theme="light" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{credit/_layout :: head(#{credit.title})}"></head>
<body class="container embedded">

    <div th:replace="~{credit/_layout :: heading(${productId}, ${personId}, ${language})}">Heading</div>

    <article class="section">
        <details open>
            <summary>
                <strong th:text="#{credit.section.tasks}">Taken</strong>
            </summary>
            <p th:if="${#lists.isEmpty(tasks)}" class="empty-state"
               th:text="#{credit.empty.tasks}">No open tasks</p>
            <figure th:unless="${#lists.isEmpty(tasks)}">
                <table role="grid">
                    <thead>
                        <tr>
                            <th th:text="#{credit.task.description}">Omschrijving</th>
                            <th th:text="#{credit.task.dueDate}">Vervaldatum</th>
                            <th th:text="#{credit.task.status}">Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="t : ${tasks}">
                            <td th:text="${t.description}">Task</td>
                            <td th:text="${#temporals.format(t.dueDate, 'dd-MM-yyyy')}">01-06-2026</td>
                            <td th:text="${t.status}">Open</td>
                        </tr>
                    </tbody>
                </table>
            </figure>
        </details>
    </article>

</body>
</html>
